target_markets:
- text: Civil and geotechnical engineers
- text: Developers and planners
- text: Contractors
- text: Transport and utilities infrastructure owners and operators
- text: Environmental and geochemical specialists and hydrologists
challenges:
- text: Unexpected sulfate attack on concrete causing expansion and cracking in buried concrete
- text: Oxidation of sulfides during excavation or material handling can generate acidic conditions, heave
    or aggressive groundwater
- text: Inaccurate early-stage material specifications without indicative sulfate/sulfide data
- text: Cost overruns and delays from redesigns, replacement of materials or requirements for additional
    protective measures
- text: Regulatory standards such as BRE SD1 require assessment of sulfate conditions before construction
use_cases:
- text: 'Foundation and basement design: identifying whether sulfate-resistant concrete is required for
    footings, slabs or retaining walls'
- text: 'Utility installation: assessing chemical risks to buried pipes, chambers and concrete surrounds'
- text: 'Earthworks and cuttings: understanding whether excavation may expose sulfide-bearing materials
    to oxidation'
- text: 'Transport corridor planning: mapping chemical ground risks along long linear routes to inform
    material selection and material handling regimes'
- text: 'Environmental impact assessments: identifying potential for acid generation or aggressive groundwater
    conditions'
