name: 'BGS Civils: sulfate/sulfide potential'
slug: bgs-civils-sulfate-sulfide-potential
theme: engineering-geology
portfolio_pages:
- 35
- 36
overview: 'BGS Civils: sulfate/sulfide potential identifies where naturally occurring or anthropogenic
  sulfate and sulfide minerals in near - surface geological materials may pose a risk to buried concrete
  and other construction materials. It translates 1:50 000-scale geological mapping, geochemistry and
  engineering geology knowledge into practical domains indicating where ground conditions could generate
  aggressive chemical environments, such as direct sulfate attack on concrete or sulfide oxidation producing
  acidic pore-water conditions. The dataset is part of the wider BGS Civils suite, which provides engineering-relevant
  geological intelligence for early-stage design, asset management and risk assessment.'
benefits:
- text: Early identification of sulfate-rich or sulfide-bearing ground that may attack concrete or steel
- text: Reduced risk of costly remediation, redesign or structural deterioration caused by chemical attack
- text: Improved environmental and safety management, especially where sulfide oxidation may generate
    acidic or expansive conditions
- text: Consistent national-scale intelligence that complements laboratory testing and site-specific geotechnical
    investigation
features:
- text: National coverage across Great Britain
- text: 1:50 000 scale (±50 m)
- text: Sulfate/sulfide potential classification, indicating the likelihood of aggressive chemical conditions
    based on the on the form and distribution of any sulfate or sulfide minerals in the ground
- text: Includes indications for the impact of weathering and leaching of ground materials
- text: GIS vector format for ease of geospatial analysis
- text: Consistent classification based on BGS’s engineering geology expertise and geotechnical literature
- text: Part of the BGS Civils suite, which can be combined with datasets about geological materials and
    their engineering characteristics
