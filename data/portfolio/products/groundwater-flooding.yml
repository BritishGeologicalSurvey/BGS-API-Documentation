target_markets:
- text: Local authorities and planners
- text: Environmental agencies
- text: Civil, environmental and geotechnical engineers
- text: Transport and utilities infrastructure owners and operators
- text: Insurance, lenders and risk analysts
- text: Conveyancing reporters
- text: Emergency planners
- text: Developers and landowners
challenges:
- text: Limited awareness of groundwater flooding, which is often overlooked compared with river or surface
    water flooding
- text: Unexpected groundwater emergence causing damage to basements, foundations and underground infrastructure
- text: Lack of consistent national data, making it difficult to assess risk across large portfolios or
    regions
- text: Complex geological controls on groundwater behaviour that are hard to interpret without specialist
    datasets
use_cases:
- text: 'Planning applications: screening proposed developments for groundwater flooding constraints before
    design begins'
- text: 'Basement and foundation design: identifying areas where groundwater pressure or emergence may
    require waterproofing or drainage'
- text: 'Infrastructure resilience: assessing risk to tunnels, cuttings, culverts and buried utilities'
- text: 'Flood risk assessments: incorporating groundwater flooding into multiple-source flood modelling'
- text: 'Portfolio level risk analysis: helping insurers or asset managers understand exposure across
    large geographical areas'
- text: 'Emergency response planning: identifying communities that are vulnerable during prolonged wet
    winters or rapid recharge events'
