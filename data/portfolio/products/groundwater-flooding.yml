name: Groundwater flooding
slug: groundwater-flooding
theme: hazards
portfolio_pages:
- 69
- 70
overview: BGS’s groundwater flooding provides an assessment of areas in Great Britain where geological
  conditions could enable groundwater flooding at the surface. The data also highlights areas where groundwater
  may come close to the ground surface, affecting basements and buried infrastructure. It identifies where
  geological, hydrogeological and topographical conditions make groundwater flooding more likely, including
  bedrock aquifers, permeable superficial deposits, topographical controls and areas with shallow water
  tables. The dataset supports planning, infrastructure design, flood-risk management and emergency preparedness
  by offering a consistent, evidence-based view of groundwater-related flood hazards.
benefits:
- text: Highlights flood mechanisms not captured by surface water or river flood models, giving a more
    complete view of flood risk
- text: Supports planning and development decisions, especially in areas with permeable bedrock or superficial
    deposits
- text: Helps infrastructure owners anticipate groundwater emergence, which could damage basements, tunnels,
    utilities and transport corridors
- text: Provides evidence for flood risk assessments, resilience planning and regulatory compliance.
- text: Offers a nationally consistent, geologically informed assessment that improves early-stage risk
    screening
features:
- text: National coverage across Great Britain
- text: 1:50 000 scale (±50 m)
- text: Geologically informed susceptibility mapping, considering bedrock aquifer properties, superficial
    deposits, topography and hydrogeological observations where available
- text: Simple classification of groundwater flooding susceptibility, highlighting areas susceptible to
    groundwater flooding at the surface, areas where groundwater levels may impact property or assets
    below the ground surface and areas unlikely to experience groundwater flooding
- text: A supporting layer indicates confidence in the susceptibility classification, allowing users to
    critically assess the data for their needs
- text: GIS vector format for ease of geospatial analysis
- text: Supports multi-source flood risk assessment, complementing river, coastal and surface water datasets
