name: Depth to groundwater
slug: depth-to-groundwater
theme: hydrogeology
portfolio_pages:
- 81
- 82
overview: BGS’s depth to groundwater dataset assesses how deep the (phreatic) water table is likely to
  be beneath the ground surface across Great Britain. It draws on topography, knowledge of surface water/groundwater
  interactions and permeability mapping to estimate the typical depth to groundwater. The data also flags
  areas where geological conditions may result in significant variations in groundwater levels from those
  presented by the model. Due to the poor spatial distribution of groundwater observations, the model
  does not utilise measured groundwater levels in wells or boreholes directly, but they have been used
  to validate model performance.
benefits:
- text: Offers a nationally consistent indication of groundwater depth
- text: Helps identify where shallow groundwater may pose risks to basements, foundations, excavations
    and underground infrastructure
- text: Provides evidence for flood risk assessments, especially in areas prone to groundwater emergence
- text: Offers a modelled view of groundwater levels where local monitoring data is limited or unavailable
- text: Helps screen sites before detailed hydrogeological investigations are commissioned
features:
- text: National coverage across Great Britain
- text: 1:50 000 scale (±50 m)
- text: Modelled depth to groundwater values presented as a raster grid
- text: Supplementary vector overlay identifying areas where phreatic groundwater levels may vary significantly
    from the raster grid
- text: GIS vector and raster formats for ease of geospatial analysis
