target_markets:
- text: Civil, environmental and geotechnical engineers
- text: Local authorities and planners
- text: Developers
- text: Water and sewerage companies
- text: Transport and utilities infrastructure owners
challenges:
- text: Difficulty accessing consistent geological information at national and regional scale from disparate
    sources
- text: Need for digital geospatial data rather than legacy paper maps
- text: Uncertainty about subsurface conditions making early-stage assessment difficult without authoritative
    mapping
- text: Time-consuming compilation of robust geological evidence to meet legislative and regulatory requirements
- text: Challenging ground conditions cause delays and cost overruns if not identified early
- text: Complexity of national asset networks with a need to understand ground conditions for thousands
    of distributed assets
use_cases:
- text: 'Construction planning: assessing dewatering needs for excavations, basements or utility trenches'
- text: 'Flood risk assessment: evaluating the potential for groundwater emergence during wet periods'
- text: 'Infrastructure resilience: screening rail cuttings and tunnels for groundwater-related risks'
- text: 'Land-use planning: identifying constraints for developments in low-lying or permeable areas'
