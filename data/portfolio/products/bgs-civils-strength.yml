name: 'BGS Civils: strength'
slug: bgs-civils-strength
theme: engineering-geology
portfolio_pages:
- 33
- 34
overview: 'BGS Civils: strength provides an indicative assessment of the likely strength of near-surface
  geological materials across Great Britain. It translates 1:50 000-scale geological mapping and engineering
  geology expertise into practical strength classes that reflect how soils, superficial deposits and weathered
  or unweathered rock are expected to behave under load or during excavation. The dataset is part of the
  wider BGS Civils suite, which provides engineering-relevant geological intelligence for early-stage
  design, asset management and risk assessment.'
benefits:
- text: Early identification of weak, strong or highly variable ground, improving design decisions
- text: Classification of the strength of coarse and fine soils or rocks, as defined by British Standard
    5930
- text: More accurate cost and programme estimates, reducing the risk of unexpected ground-related delays
- text: Consistent national-scale intelligence that complements site - specific geotechnical testing
features:
- text: National coverage across Great Britain
- text: 1:50 000 scale (±50 m)
- text: Strength classification for soils, superficial deposits and rock, indicating likely engineering
    behaviour
- text: Definitions of the engineering strength of rocks and fine soils provided as minimum, maximum and
    typical strengths
- text: Definitions of the engineering strength of coarse soils provided as minimum, maximum and typical
    densities
- text: GIS vector format for ease of geospatial analysis
- text: Consistent classification based on BGS’s engineering geology expertise and geotechnical literature
- text: Part of the BGS Civils suite, which can be combined with datasets about geological materials and
    their engineering characteristics
