target_markets:
- text: Civil, environmental and geotechnical engineers
- text: Developers and planners
- text: Contractors
- text: Transport and utilities infrastructure owners and operators
challenges:
- text: Unexpected ground conditions can cause redesigns or delays
- text: Inaccurate early-stage cost estimates without indicative strength data
- text: Limited early-stage ground information ahead of site investigation
- text: Differential settlement resulting from geological variation over short distances, creating uneven
    ground performance
use_cases:
- text: 'Foundation design feasibility: identifying whether ground strength is likely to support shallow
    foundations or require piling'
- text: 'Earthworks planning: estimating the strength of materials to inform cut and fill design, compaction
    requirements and haulage planning'
- text: 'Slope stability assessments: understanding how material strength influences the risk of slips
    or failures and the need for reinforcement'
- text: 'Utility trenching: anticipating whether soils or weathered rock will require specific excavation
    methods or support'
- text: 'Transport corridor planning: mapping strength variations along long linear routes to anticipate
    engineering challenges'
