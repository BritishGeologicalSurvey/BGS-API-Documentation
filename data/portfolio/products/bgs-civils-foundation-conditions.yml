name: 'BGS Civils: foundation conditions'
slug: bgs-civils-foundation-conditions
theme: engineering-geology
portfolio_pages:
- 31
- 32
overview: 'BGS Civils: foundation conditions assesses how near-surface geological materials across Great
  Britain are likely to behave as foundations for buildings and infrastructure. It translates 1:50 000
  - scale geological mapping and engineering geology knowledge into practical indicators of ground performance,
  including bearing capacity, settlement potential, strength and volume change potential. The dataset
  is part of the wider BGS Civils suite, which provides engineering-relevant geological intelligence for
  early-stage design, asset management and risk assessment.'
benefits:
- text: Early identification of ground that may cause excessive settlement or low bearing capacity
- text: Better planning for foundation type selection, such as shallow footings, rafts or piles
- text: More accurate cost and programme forecasting, reducing the likelihood of unexpected ground-related
    delays
- text: Improved risk management for developments in areas with variable or weak geology
- text: Consistent national-scale intelligence that complements site - specific geotechnical testing
features:
- text: National coverage across Great Britain
- text: 1:50 000 scale (±50 m)
- text: 'Foundation behaviour classification considering: or high chloride content'
  sub:
  - strength or bearing capacity
  - subsidence or collapse due to dissolution
  - volume change in clays during foundation excavation
  - settlement (compressibility) and differential settlement
  - weathering and alteration
  - aggressive ground conditions of soluble sulfate, sulfide, low pH
- text: GIS vector format for ease of geospatial analysis
- text: Consistent classification based on BGS’s engineering geology expertise and geotechnical literature
- text: Part of the BGS Civils suite, which can be combined with datasets about geological materials and
    their engineering characteristics
