challenges:
- text: Unexpected foundation failures or redesigns cause costly changes late in a project
- text: Limited early-stage ground information ahead of site investigation or land acquisition
- text: Fragmented or inconsistent data on all factors influencing foundation behaviour
- text: Differential settlement resulting from geological variation over short distances, creating uneven
    ground performance
- text: Regulatory requirements to provide evidence of ground suitability and risk mitigation
use_cases:
- text: 'Land-use modelling: identifying areas where housing developments are more or less likely to require
    special foundation design'
- text: 'Housing development feasibility: identifying whether specific foundation designs are more or
    less suitable, or whether alternatives are possible'
- text: 'Ground investigation planning: understanding where ground conditions are impacting foundation
    design and will need exploratory investigation'
- text: 'Cost modelling: estimating likely foundation complexity to inform early project budgets'
- text: 'Retrospective assessment: supporting investigation of a developed site experiencing foundation
    issues'
