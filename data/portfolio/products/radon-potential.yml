name: Radon potential
slug: radon-potential
theme: hazards
portfolio_pages:
- 75
- 76
overview: BGS’s radon potential dataset provides an assessment of the likelihood that radon gas will be
  present at elevated levels in homes and workplaces across Great Britain and Northern Ireland. Radon
  is a naturally occurring, radioactive gas that can accumulate indoors and is a recognised health risk.
  The dataset combines interpretation of geological mapping, indoor radon measurements and statistical
  modelling to map radon potential at a fine spatial scale. Developed in collaboration with the UK Health
  Security Agency (UKHSA), it is the authoritative national dataset used by Government, public health
  bodies, planners and property professionals.
benefits:
- text: Supplies a trusted, authoritative assessment of radon potential based on extensive measurements
    and geological understanding
- text: Fine-scale mapping that helps identify where radon protection measures are required in new buildings
- text: Supports adherence to statutory obligations set out in public health legislation
- text: Provides evidence for public health planning, risk communication and targeted testing campaigns
- text: Informs property transactions, mortgage assessments and home - buyer information
features:
- text: National coverage across Great Britain and Northern Ireland
- text: 1:50 000 scale (±50 m)
- text: Integration of geology and indoor radon measurements, providing a robust evidence base
- text: Radon potential classification, indicating the probability that a property will exceed the UK
    Action Level
- text: Nation-specific attribution, with regional variations in radon legislation and action levels for
    England, Northern Ireland, Scotland and Wales accounted for and regional specific classifications
    and advice given for each nation
- text: BGS GeoReports are available for site-specific queries
- text: GIS vector format for ease of geospatial analysis
- text: Periodic updates, incorporating new measurements and improved modelling
- text: Official dataset developed by leading radon authorities (BGS, the Geological Survey of Northern
    Ireland and UKHSA) and used by the UK Government and public health bodies to define radon - affected
    areas
- text: Open access is available for a generalised, low-resolution version of the data
