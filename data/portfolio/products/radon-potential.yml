target_markets:
- text: Local authorities and planners
- text: Public health agencies
- text: Property professionals, including surveyors, conveyancers and estate agents
- text: Homebuyers and homeowners
- text: Developers and architects
- text: Infrastructure owners and operators
- text: Environmental and risk consultants
challenges:
- text: Limited awareness of radon risk, especially in areas where geology strongly influences indoor
    concentrations
- text: Uncertainty during property transactions, as buyers and sellers need reliable radon information
- text: Regulatory requirements for radon protection in new buildings, which need accurate mapping
- text: Health risks associated with long-term radon exposure, including increased risk of lung cancer
- text: Fragmented or outdated local information, making national-scale assessment difficult without a
    unified dataset
- text: Difficulty identifying priority testing areas, particularly for local authorities and public health
    teams
use_cases:
- text: 'Planning and building control: determining whether new buildings require basic or full radon
    protection measures'
- text: 'Property surveys: providing radon risk information during home purchase or valuation'
- text: 'Public health campaigns: identifying high-risk communities for targeted radon testing'
- text: 'Workplace risk assessments: ensuring compliance with radiation safety regulations in basements,
    tunnels or ground-contact structures'
- text: 'Environmental risk reporting: integrating radon potential into wider environmental or geohazard
    assessments'
