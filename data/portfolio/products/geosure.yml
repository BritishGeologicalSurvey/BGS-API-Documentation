overview: 'BGS’s GeoSure ® assesses the natural susceptibility of geological deposits to potential ground
  movement resulting from six key natural geohazards. It converts geological and geotechnical knowledge
  into hazard classes that indicate potential for the ground to cause stability problems for buildings,
  infrastructure and buried assets. Collapsible deposits: some deposits can undergo a reduction in volume
  if loaded or saturated, resulting in collapse and subsidence. Compressible ground: some deposits contain
  fluids that can be squeezed out when a load is applied or groundwater levels change, resulting in a
  reduction in ground volume and causing ground movement. Landslides: different geology types and topographical
  settings can combine to increase the susceptibility to downslope ground movement (landslides), causing
  damage through loss of support to overlying or buried structures, or from direct impact. Running sand:
  some deposits contain sandy layers that can become fluidised by water flowing through them, which removes
  support for overlying structures and results in subsidence. Shrink–swell subsidence: clay-rich deposits
  that absorb water when wet and lose water when drying increase and decrease in volume as they do so.
  This volume change causes seasonal movement of the ground upwards (heave) or downwards (subsidence).
  Soluble rocks: some deposits dissolve in water, resulting in underground cavities that can collapse
  and cause ground movement, or fill with sediment, which can later be washed out due to changes in groundwater
  or surface water and can result in ground movement.'
benefits:
- text: Identifies ground related risks early, before intrusive investigation or design work begins
- text: Supports planning and development control, ensuring ground conditions are considered in land-use
    decisions
- text: Improves infrastructure resilience, especially for utilities and transport networks exposed to
    ground movement
- text: Reduces the likelihood of unexpected ground failures, which can be costly and disruptive
- text: Provides evidence for insurance and risk modelling, particularly for subsidence and landslide
    risk
features:
- text: Six ground instability hazards mapped with national coverage
- text: 1:50 000 scale (±50 m)
- text: Five-class hazard rating system, from very low to very high susceptibility
- text: BGS GeoReports are available for site-specific queries
- text: GIS vector format for ease of geospatial analysis
- text: Bespoke methodology per hazard, ensuring accurate assessment of ground movement potential
- text: Derived from authoritative BGS geological mapping and geotechnical data
- text: Periodically updated to incorporate new geological information and improved mapping
- text: Designed for early-stage assessment, complementing (but not replacing) site-specific investigation
- text: Open access available for a generalised, low-resolution version of the data
