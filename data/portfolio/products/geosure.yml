target_markets:
- text: Local authorities/planners • Insurance, lenders and risk analysts
- text: Civil, environmental and geotechnical engineers • Conveyancing reporters
- text: Utility companies • Developers and landowners
- text: Transport operators
challenges:
- text: Unexpected ground movement causing damage, delays or redesigns to built and buried assets
- text: Expertise required to interpret local geological conditions for potential ground hazards
- text: Increasing regulatory requirements for ground stability evidence in planning applications
- text: Insurance exposure, particularly in areas prone to shrink–swell or landslides
- text: High costs to mitigate or repair unstable ground post-construction
use_cases:
- text: 'Local development: screening planning applications for ground stability constraints'
- text: 'Planning proposals: evidencing mitigation strategies in engineering and development proposals'
- text: 'Network analysis: identifying landslide susceptibility along proposed road, rail or pipeline
    routes'
- text: 'Claims analysis: supporting insurance underwriting for ground subsidence'
- text: 'Portfolio resilience assessment: assessing financial portfolios for exposure to geohazards'
- text: 'Property transactions: reporting potential hazards to properties during conveyancing searches'
