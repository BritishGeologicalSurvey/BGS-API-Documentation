overview:
- text: 'Tier 1: a summary overview of the catchment characteristics'
- text: 'Tier 2: subcatchment-scale summaries of key characteristics, including:'
  sub:
  - erosion susceptibility
  - geological run-off potential
  - flood accommodation capacity
  - catchment morphology
- text: 'Tier 3: information for individual stretches of river: percentage of reach classed as bedrock,
    strength and composition of that bedrock deposits that make up the riverbed riverbank material to
    erosion'
  sub:
  - geological properties of the riverbed and banks, such as
  - susceptibility to erosion of both the superficial and bedrock
  - river morphology classifiers
  - susceptibility to lateral erosion, that is, susceptibility of the
benefits:
- text: A nationally consistent assessment of scour susceptibility for rivers and floodplains
- text: Multi-tier offering allows for assessments at different scales
- text: Evidence to support infrastructure design, maintenance and resilience planning, especially for
    bridges, pipelines and transport corridors
- text: Insight into geomorphological factors that influence erosion, sediment transport and channel stability
- text: Support for flood-risk management, as scour often intensifies during high flow events
- text: A way to integrate geological and geomorphological intelligence into asset management systems
    and environmental assessments
features:
- text: National coverage across Great Britain’s river network
- text: Tier 3 is 1:50 000 scale (±50 m) and aligns to the OS Open Rivers Watercourse dataset for easy
    integration with other riverine datasets
- text: Open access to data for tiers 1 and 2
- text: GIS vector format for ease of geospatial analysis
- text: Scour susceptibility classification based on geomorphology, hydrology, geology and topography
- text: Provision of the average, best - and worst-case erosion susceptibility classes per river reach
    to convey the variation and heterogeneous behaviour of geological deposits and to allow the user to
    consider both end members for scour potential according to their needs
- text: Consistent methodology, enabling comparison across catchments and regions
- text: Designed for early-stage assessment, complementing site-specific hydraulic or geotechnical studies
