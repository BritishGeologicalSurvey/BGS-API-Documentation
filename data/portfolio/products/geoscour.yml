challenges:
- text: Limited sediment-supply proxy data for river erosion modelling
- text: Increasing climate-driven extremes, which intensify erosion and channel instability
- text: High maintenance and repair costs when scour is not identified early
- text: Regulatory and safety pressures requiring evidence-based assessment of river-related hazards
- text: Difficulty predicting channel behaviour, especially in complex or geologically diverse catchments
