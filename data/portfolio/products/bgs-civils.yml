name: BGS Civils
slug: bgs-civils
theme: engineering-geology
portfolio_pages:
- 19
- 20
overview: The BGS Civils engineering geology datasets translate geological information into practical
  assessments of how the ground is likely to behave during construction and civil engineering projects.
  These datasets cover themes such as bulking volume, corrosivity, discontinuities, engineered fill, excavatability,
  foundation conditions, strength and sulfate/sulfide potential. Each dataset provides nationally consistent
  layers in GIS formats that help users understand engineering constraints before intrusive investigation.
benefits:
- text: Reduce uncertainty in feasibility and concept design
- text: Identify potentially challenging ground conditions before committing to costly site investigation
- text: Improve cost forecasting, especially for earthworks, foundations and material management
- text: Support planning and regulatory compliance with authoritative geological intelligence
- text: Enhance infrastructure resilience, particularly for utilities and transport networks
- text: Integrate engineering relevant geological data into asset management systems and environmental
    assessments
- text: Designed to complement, not replace, site-specific geotechnical testing
features:
- text: National coverage across Great Britain
- text: 1:50 000 scale (±50 m)
- text: 'Multiple engineering geology themes, including:'
  sub:
  - bulking volume
  - corrosivity (ferrous)
  - discontinuities
  - engineered fill
  - excavatability
  - foundation conditions
  - strength
  - sulfate/sulfide potential
- text: Derived from authoritative BGS data sources, such as our geological mapping and the BGS National
    Geotechnical Properties Database
- text: GIS vector format for ease of geospatial analysis
- text: Attribute-rich polygons describing engineering behaviour and geological context
