target_markets:
- text: Civil and geotechnical engineers
- text: Environmental consultants
- text: Transport and utilities infrastructure owners and operators
- text: Local authorities and planners
- text: Developers and contractors
challenges:
- text: Unexpected ground conditions leading to delays, redesigns or increased costs
- text: Fragmented or inconsistent data sources, making early-stage assessment difficult
- text: High maintenance costs of buried assets due to degradation caused by ground conditions
- text: Regulatory pressures requiring evidence of ground risk consideration
- text: Challenges in planning earthworks, foundation design and material re-use
- text: Difficulty estimating excavation effort, settlement risk or chemical aggression
use_cases:
- text: 'Early-stage site screening: identifying excavation considerations, geotechnical properties or
    corrosive soils before design begins'
- text: 'Earthworks planning: using excavatability, bulking and strength datasets to estimate plant needs
    and cut and fill volumes'
- text: 'Foundation feasibility: assessing whether shallow foundations are viable or whether piling is
    likely to be needed'
- text: 'Utility route planning: mapping corrosivity, discontinuities and sulfate/sulfide potential along
    pipeline or cable corridors'
- text: 'Slope and embankment design: using discontinuities and strength data to assess stability'
- text: 'Asset management prioritisation: identifying where ground hazards may threaten existing infrastructure'
