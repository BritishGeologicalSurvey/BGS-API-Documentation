challenges:
- text: Unexpected excavation instability increases costs due to unforeseen support requirements
- text: Limited early-stage structural geology data ahead of site investigation
- text: Difficulty planning site health and safety ahead of excavation
- text: Difficulty predicting behaviour of weathered rock, which can complicate design
use_cases:
- text: 'Highway or rail cuttings: identifying where discontinuities may cause block falls or require
    slope reinforcement'
- text: 'Basement and foundation excavations: assessing whether rock masses will break into blocks or
    require controlled excavation'
- text: 'Tunnel and trench design: understanding how jointing and bedding may influence stability during
    construction'
- text: 'Slope stability assessments: evaluating potential for planar, wedge or toppling failures in rock
    slopes'
- text: 'Utility corridor planning: anticipating ground behaviour along long linear routes where discontinuities
    vary significantly'
