name: 'BGS Civils: discontinuities'
slug: bgs-civils-discontinuities
theme: engineering-geology
portfolio_pages:
- 25
- 26
overview: 'BGS Civils: discontinuities identifies where geological discontinuities (such as bedding planes,
  joints, fractures, faults and other structural weaknesses) are likely to influence engineering behaviour
  in near - surface ground. It translates 1:50 000-scale geological mapping and engineering geology knowledge
  into a practical assessment of how discontinuities may affect excavation stability, slope performance,
  foundation design and ground/structure interaction. The dataset is part of the wider BGS Civils suite,
  which provides engineering-relevant geological intelligence for early-stage design, asset management
  and risk assessment.'
benefits:
- text: Anticipate excavation stability issues before intrusive investigation
- text: Identify geological units where blocky, fissile or highly fractured behaviour is likely
- text: Reduce uncertainty in slope design, foundation planning and earthworks
- text: Improve safety by highlighting areas where discontinuities may lead to rockfalls, slips or wedge
    failures
- text: Support cost forecasting by identifying where additional support, reinforcement or excavation
    methods may be required
features:
- text: National coverage across Great Britain, aligned with BGS’s geological mapping
- text: 1:50 000 scale (±50 m)
- text: Discontinuity type classification including stratification planes, foliation planes and fractures
    as defined by the International Society for Rock Mechanics and by British Standard BS5930
- text: GIS vector format for ease of geospatial analysis
- text: Consistent classification based on BGS engineering geology expertise and geotechnical literature
- text: Part of the BGS Civils suite, which can be combined with datasets about geological materials and
    their engineering characteristics
