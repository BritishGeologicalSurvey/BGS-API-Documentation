target_markets:
- text: Mineral extraction companies and resource planners
- text: Local authorities and planning officers
- text: Environmental and engineering consultants
- text: Construction and infrastructure companies
- text: Landowners and developers
challenges:
- text: Difficulty accessing consistent geological information at national and regional scale from disparate
    sources
- text: Need for digital geospatial data rather than legacy paper maps
- text: Uncertainty about subsurface conditions making early-stage assessment difficult without authoritative
    mapping
- text: Time consuming compilation of robust geological evidence to meet legislative and regulatory requirements
- text: Challenging ground conditions cause delays and cost overruns if not identified early
- text: Complexity of national asset networks with a need to understand ground conditions for thousands
    of distributed assets
use_cases:
- text: 'Planning applications: checking for nearby quarries or historical workings that may affect development
    suitability'
- text: 'Local development planning: identifying legacy sites that could be repurposed and active sites
    available to supply developments with raw materials'
- text: 'Resource evaluation: assessing the potential for re-opening or expanding mineral extraction sites'
- text: 'Supply chain analysis: finding producers of specific minerals such as limestone, sand and gravel,
    slate or industrial minerals'
- text: 'Environmental impact assessments: understanding the legacy of extraction on landforms, hydrology
    and contamination'
