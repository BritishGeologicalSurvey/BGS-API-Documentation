name: BritPits
slug: britpits
theme: minerals
portfolio_pages:
- 93
- 94
overview: BritPits is BGS’s comprehensive database of active, inactive and historical mines, quarries
  and mineral extraction sites across the UK. It records information on the location, operational status,
  ownership, extracted commodities and geological context of each site. The dataset is continually updated
  and is one of the most authoritative sources of information on mineral extraction activity, supporting
  planning, resource management, environmental assessment and industry analysis.
benefits:
- text: A single, authoritative source of information on mineral extraction sites, past and present
- text: Detailed insight into the minerals that are or were extracted, helping assess resource potential
- text: Support for planning and permitting, where knowledge of nearby quarries or former workings is
    essential
- text: Evidence of legacy mining for geological, environmental and land - use assessments
- text: A way to identify commercial opportunities, such as suppliers of specific aggregates or industrial
    minerals
features:
- text: National coverage for Great Britain, Northern Ireland, the Isle of Man and the Channel Islands
- text: X-Y point data representing the centre of surface workings (±10 m) or the entrance of underground
    workings (±50 m)
- text: Information on operational status, including active, inactive, dormant and closed sites
- text: Commodity data detailing minerals that are or were extracted
- text: Geographical coordinates in local projection systems for precise mapping and GIS integration
- text: Site name, ownership and operator information, where available
- text: Geological context, linking sites to bedrock and superficial deposits
- text: Regular updates to ensure current and historical accuracy
- text: GIS vector format for ease of geospatial analysis, along with tabular formats (CSV)
- text: 'Multi-tier dataset to suit all needs: considered operational only (open access)'
  sub:
  - 'full dataset: all records held, including historical sites'
  - 'active, inactive and dormant data: information on sites'
  - 'index data: name, status and location of all recorded workings'
