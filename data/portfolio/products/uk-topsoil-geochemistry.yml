target_markets:
- text: Environmental consultants
- text: Local authorities and planners
- text: Environmental regulators
- text: Public health agencies
- text: Agricultural and land-management professionals
challenges:
- text: Lack of consistent baseline data, making it hard to compare sites or assess long-term trends
- text: Regulatory pressure to demonstrate compliance with environmental standards
- text: Fragmented or outdated local datasets, which may not reflect current conditions
- text: Challenges in assessing ecological and human health risks without robust geochemical context
use_cases:
- text: 'Agricultural land management: understanding nutrient levels and trace element distribution to
    guide soil improvement strategies'
- text: 'Environmental monitoring: tracking long-term changes in soil chemistry due to industry, transport
    or atmospheric deposition'
- text: 'Ecosystem risk assessment: evaluating whether soil chemistry poses risks to vegetation, wildlife
    or water bodies'
- text: 'Public health studies: mapping areas with elevated lead or arsenic to support targeted interventions'
