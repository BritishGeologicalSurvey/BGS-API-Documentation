name: UK topsoil geochemistry
slug: uk-topsoil-geochemistry
theme: geochemistry
portfolio_pages:
- 43
- 44
overview: BGS’s UK topsoil geochemistry dataset maps the chemical composition of topsoil across the UK.
  It provides concentrations of 41 major and trace elements derived from geochemical analyses of 57 966
  topsoil samples, which were collected between 1978 and 2014 across England, Wales, Northern Ireland
  and part of Scotland. The dataset establishes a comprehensive and robust geochemical baseline, helping
  users understand natural soil chemistry, identify contamination and support environmental planning and
  land - management decisions.
benefits:
- text: Offers a consistent baseline against which contamination, land - use change and regulatory compliance
    can be evaluated, supporting environmental assessment
- text: Provides nationally consistent baseline geochemical data, essential for benchmarking site-specific
    studies against the geochemical background
- text: Reliable evidence for contaminated land assessments, environmental permitting and planning applications
    based on topsoil analyses with comprehensive coverage
- text: Assists in land-use planning, redevelopment and agricultural management by identifying areas with
    elevated or unusual soil chemistry
features:
- text: Coverage of England, Northern Ireland, Wales and part of Scotland with systematic sampling
- text: Element concentrations derived from X-ray fluorescence spectrometry of topsoil samples provided
    as wt% or mg/kg, with supporting prediction standard error values
- text: Geochemical predictions on a regular 500 × 500 m grid with supporting information on regional
    sample density and appropriate scale of use
- text: GIS raster formats supporting geospatial analysis with an image atlas available for reference
