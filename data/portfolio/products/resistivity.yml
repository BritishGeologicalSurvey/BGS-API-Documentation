target_markets:
- text: Civil and geotechnical engineers
- text: Power network engineers and connection providers
- text: Developers and planners
- text: Contractors
- text: Transport and utilities infrastructure owners and operators
challenges:
- text: Unknown ground conditions at a new site with no way of estimating possible resistivities of ground
    materials
- text: Potentially high variance of resistivity in the shallow subsurface
- text: Limited information to allow costing of earthing design
- text: Cost overruns and delays from redesigns, replacement of materials or requirements for additional
    protective measures
- text: Market need for regional and national information beyond ‘local installer’ knowledge
use_cases:
- text: 'Earthing and grounding design: identifying or confirming likely ranges of resistivity to be found
    in shallow subsurface prior to site visit'
- text: 'Utility installation: assessing equipment and materials needs for untested locations'
- text: 'Retrospective assessments: understanding whether ground conditions are subject to low resistivity
    or high conductivity conditions, posing a potential issue for stray currents and corrosion'
