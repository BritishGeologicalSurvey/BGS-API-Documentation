name: Resistivity
slug: resistivity
theme: engineering-geology
portfolio_pages:
- 37
- 38
overview: BGS’s resistivity dataset presents modelled resistivity values for near - surface geological
  materials across Great Britain, which are verified by comparison with the National Resistivity Soundings
  Database and apparent resistivity estimates from airborne electromagnetic surveys. Resistivity is a
  measure of how strongly subsurface materials resist electrical currents, which is directly influenced
  by lithology, porosity, moisture content, salinity and degree of weathering.
benefits:
- text: Early indication of typical ranges of resistivity to be expected in shallow geological materials
- text: Supports planning for installing new power equipment on undeveloped sites
- text: Improved estimations for site preparation and earthing equipment for new or redeveloped sites
- text: Consistent national-scale intelligence that complements geotechnical and geophysical investigation
features:
- text: National coverage across Great Britain
- text: 1:50 000 scale (±50 m)
- text: Modelled 20th, 50th and 80th centile values for resistivity of shallow geological materials
- text: GIS vector format for ease of geospatial analysis
- text: Simplified classification of materials based on BGS’s engineering geology expertise
- text: Complementary to the BGS Civils suite, which can be combined with datasets about geological materials
    and their engineering characteristics
