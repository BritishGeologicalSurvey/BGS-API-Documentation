overview: BGS’s soil chemistry for environmental assessments dataset provides key information for evaluating
  the presence of potentially harmful elements (PHEs), including arsenic, cadmium, chromium, copper, nickel,
  lead, tin and zinc, in topsoils across Great Britain. The presence of PHEs in soil can have implications
  for the health of residents, safety and the value of property, especially in relation to development.
benefits:
- text: Assists land-use and redevelopment planning to identify where elevated soil PHE concentrations
    may be a concern
- text: Can be applied to distinguish between natural background levels of PHEs in soil and those caused
    by anthropogenic contamination, reducing uncertainty in site investigations
- text: Supports regulatory compliance, including planning conditions, environmental permitting and contaminated
    land assessments
- text: Informs risk assessment for human and ecosystem health
features:
- text: 'Estimated ambient background soil chemistry: nickel, lead, tin and zinc concentrations based
    on measurements from BGS rural soil and stream sediment geochemical baseline samples composition,
    allowing natural geochemical patterns to be distinguished from artificial contamination'
  sub:
  - modelled estimates of arsenic, cadmium, chromium, copper,
  - reflecting ‘ambient’ (predominantly geogenic or natural) soil
  - national coverage across Great Britain
- text: 'Measured urban soil chemistry: individual soil samples collected by BGS geochemical surveys in
    23 major UK urban areas, collected at a density of four samples per square kilometre'
  sub:
  - locations and measured concentrations of PHEs in
- text: 'Estimated urban soil chemistry: bioaccessibility levels for arsenic and lead across 23 major
    UK urban areas, derived from interpolation of the measured urban topsoil data'
  sub:
  - interpolated estimates of PHE concentrations and
