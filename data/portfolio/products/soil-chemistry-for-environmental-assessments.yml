target_markets:
- text: Environmental consultants
- text: Local authorities and planners
- text: Developers and landowners
- text: Environmental regulators
- text: Public health agencies
challenges:
- text: Difficulty determining natural vs. artificial PHE concentrations in soil, especially in urban
    or industrial areas
- text: Lack of consistent background data, making it hard to interpret local measurements of PHEs in
    soil
- text: Regulatory pressure to demonstrate that soils meet environmental standards
- text: Uncertainty in redevelopment projects, where soil chemistry can impact remediation costs and feasibility
- text: Challenges in assessing ecological and human health risks without geochemical information
use_cases:
- text: 'Pre-development site investigations: assessing whether concentrations of elements at a site are
    likely to fall within the ‘normal’ level prior to site investigation, and to provide context to aid
    the interpretation of site investigation results'
- text: 'Contaminated land assessment: comparing PHE concentrations in locally collected soil samples
    with ambient background values, to identify abnormal concentrations of PHEs and verify whether sites
    are likely to be contaminated'
- text: 'Planning and redevelopment: screening brownfield sites for potential contamination before design
    and construction, identifying whether further assessments are likely to be necessary'
- text: 'Human health risk assessment: in situations where elevated concentrations of PHEs in topsoil
    at a site are measured to exceed soil guideline values, the dataset allows it to be resolved as to
    whether these exceedances reflect naturally high (geogenic) levels of a PHE, or if they reflect the
    presence of anthropogenic pollution and land contamination'
