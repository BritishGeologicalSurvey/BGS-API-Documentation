name: 'BGS Civils: excavatability'
slug: bgs-civils-excavatability
theme: engineering-geology
portfolio_pages:
- 29
- 30
overview: 'BGS Civils: excavatability classifies how difficult it is likely to be to excavate near-surface
  geological materials across Great Britain. It translates 1:50 000-scale geological mapping and engineering
  geology knowledge into practical excavatability classes that indicate whether ground can typically be
  removed by hand tools or mechanical excavators, or requires heavy breaking. The dataset is part of the
  wider BGS Civils suite, which provides engineering-relevant geological intelligence for early-stage
  design, asset management and risk assessment.'
benefits:
- text: Better forecasting of plant requirements, from standard excavators to breakers or blasting
- text: More accurate programme and cost estimates for excavation works
- text: Early identification of hard or resistant materials that may slow construction
- text: Improved health and safety planning, reducing risks associated with unexpected hard ground
- text: More efficient cut and fill design, haulage planning and material management
features:
- text: 'Excavatability classification, providing an assessment of the mode of equipment required to excavate
    based on the strength and density of deposits. These classifications are aligned to British Standard
    BS5930 and are assessed considering:'
  sub:
  - deposit type
  - weathering
  - the presence of discontinuities
- text: GIS vector format for ease of geospatial analysis
- text: Consistent classification based on BGS’s engineering geology expertise and geotechnical literature
- text: Part of the BGS Civils suite, which can be combined with datasets about geological materials and
    their engineering characteristics
