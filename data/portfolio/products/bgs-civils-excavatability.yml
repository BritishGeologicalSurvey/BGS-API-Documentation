challenges:
- text: Unexpected hard ground conditions can cause delays and require specialist equipment
- text: Inaccurate early-stage cost estimates without indicative excavatability data
- text: Fragmented or inconsistent data on all factors influencing excavatability
use_cases:
- text: 'Highway or rail corridor design: identifying sections where excavation will require heavy plant
    or breaking, improving programme planning'
- text: 'Basement and foundation construction: anticipating whether excavation will encounter soft soils,
    stiff tills or competent rock'
- text: 'Utility trenching: planning equipment needs and excavation rates for pipelines, cables and drainage
    systems'
- text: 'Cut and fill earthworks: estimating excavation difficulty to optimise haulage, sequencing and
    material re use'
