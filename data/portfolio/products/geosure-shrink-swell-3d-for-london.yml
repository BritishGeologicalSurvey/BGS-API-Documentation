target_markets:
- text: Geotechnical, environmental and civil engineers
- text: Local authorities, planners and developers
- text: Transport and utilities infrastructure owners and operators
- text: Insurance, lenders and risk analysts
challenges:
- text: Surface-only datasets are insufficient for deep foundations, tunnels and basements
- text: Highly variable clay behaviour across short distances makes early-stage design difficult
- text: Climate-driven moisture changes increase shrink–swell risk, especially during droughts
- text: High cost of unexpected ground movement, including structural damage, service disruption and insurance
    claims
- text: Limited visibility of subsurface clay properties, especially in densely built-up areas with restricted
    access for investigation
- text: Complex geological layering in the London Basin, where different clay units behave differently
    with depth
use_cases:
- text: 'Basement and deep foundation design: understanding shrink–swell behaviour at multiple depths
    to select appropriate foundation types'
- text: 'Tunnel alignment planning: identifying zones of high-volume change potential along underground
    routes'
- text: 'Utility corridor management: assessing risks to pipelines, sewers and cables buried at varying
    depths'
- text: 'Subsidence risk modelling: supporting insurers and local authorities in identifying high-risk
    neighbourhoods'
- text: 'Climate resilience planning: evaluating how drought-driven moisture loss may affect clay shrinkage
    at depth'
