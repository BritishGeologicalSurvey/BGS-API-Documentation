name: GeoSure® shrink–swell 3D for London
slug: geosure-shrink-swell-3d-for-london
theme: hazards
portfolio_pages:
- 67
- 68
overview: BGS’s GeoSure® shrink–swell 3D for London and the Thames Valley dataset is a specialised ground
  stability dataset modelling the three - dimensional distribution and behaviour of shrink–swell clays
  beneath one of the UK’s most subsidence-prone and infrastructure-dense regions. It builds on the standard
  GeoSure® shrink–swell dataset by incorporating depth-based modelling, engineering geology and detailed
  characterisation of the London Clay Formation, the Lambeth Group and other clay-rich geological units
  that are known for significant volume change. The dataset provides a spatially continuous 3D assessment
  of how clay behaviour varies with depth, moisture and geological structure.
benefits:
- text: anticipate volume change behaviour at depth, not just at the surface
- text: improve foundation design, especially for basements, deep excavations and infrastructure
- text: reduce uncertainty in ground movement risk, particularly in areas with clay deposits at depth
- text: support urban planning and asset management in a region where shrink–swell is a major cause of
    structural damage
- text: integrate 3D geological behaviour into risk modelling, engineering design and resilience planning
features:
- text: Coverage of central London and surrounding transport corridors
- text: 1:50 000 scale (±50 m)
- text: 3D shrink–swell modelling, capturing depth-dependent behaviour of clay formations at 1 m intervals
    to a depth of 5 m, beyond which shrink–swell susceptibility classifications are provided at 5 m intervals
    to a depth of 20 m
- text: High-resolution characterisation of the London Clay Formation, the Lambeth Group and other key
    geological units derived from the BGS London Lithoframe model
- text: Modelling is constrained by borehole records, geological maps and geophysical data compiled by
    regional geological experts from the premier provider of British geological data
- text: Five hazard classes, indicating susceptibility to volume change at different depths
- text: GIS-ready vector datasets
