name: BGS Geology 10/25K
slug: bgs-geology-10-25k
theme: baseline-geology
portfolio_pages:
- 7
- 8
overview: BGS Geology 10K and 25K are BGS’s most detailed digital geological mapping datasets, representing
  the highest-resolution geological interpretation available for Great Britain. They are derived from
  1:10 000-scale surveys (with some 1:25 000-scale coverage in upland areas) and captures bedrock, superficial
  deposits, mass-movement deposits, artificial ground and linear features. The dataset covers around 52
  per cent of Great Britain, with a strong focus on urban centres and transport corridors and is continually
  expanded as BGS digitises its remaining paper archives and completes new surveys .
benefits:
- text: Site-scale geological insight enables understanding of ground conditions before on-site or intrusive
    investigation
- text: Geological map compilation by regional geological experts from the premier provider of British
    geological data
- text: Growing data coverage
- text: Accessible GIS data formats
features:
- text: 'High-resolution mapping: 1:10 000 scale (±10 m accuracy) with some 1:25 000-scale coverage (±25
    m)'
- text: 'Four thematic layers:'
  sub:
  - bedrock geology
  - mass-movement deposits
  - superficial deposits
  - artificial ground
- text: Additional data on linear features (faults; mineral veins; coal seams; landforms, etc.)
- text: Rich attribution provides details of lithology, lithostratigraphy and chronostratigraphy, and
    applies the national standards of geological classification, the BGS Lexicon and the BGS Rock Classification
    Scheme
- text: Applies national geological standards of symbology and colour scheme
- text: Extensive coverage of urban areas and transport corridors, prioritised where development pressures
    are highest
- text: Regularly updated to reflect new surveys, corrections and improved geological interpretations
- text: GIS vector format for ease of geospatial analysis
