target_markets:
- text: Engineering and geotechnical consultants
- text: Urban planners, local authorities and environmental consultants
- text: Environmental and geohazard specialists
- text: Mineral planners and resource managers
- text: Academics
challenges:
- text: Lack of high-resolution data suitable for preliminary, remote assessments
- text: Need for digital geospatial data rather than legacy paper maps
- text: Uncertainty about subsurface conditions making early-stage assessment difficult without authoritative
    mapping
- text: Time consuming compilation of robust geological evidence to meet legislative and regulatory requirements
- text: Delays and cost overruns if challenging ground conditions are not identified early
- text: Early identification of artificial ground, infill or legacy industrial modifications on brownfield
    sites
use_cases:
- text: 'Development screening: engineers need to identify geological constraints such as faulting, landslides
    or problematic lithologies before intrusive investigation at potential sites'
- text: 'Environmental impact assessments: planners need to document baseline geological conditions and
    assess development impacts'
- text: 'Brownfield redevelopment: identification of artificial ground, infill or legacy industrial modifications
    helps determine remediation needs and engineering constraints'
- text: 'Infrastructure planning: transport authorities can assess geological conditions along proposed
    routes'
- text: 'Mineral resource evaluation: users can identify nearby sand, gravel or bedrock resources and
    assess whether development may sterilise them'
