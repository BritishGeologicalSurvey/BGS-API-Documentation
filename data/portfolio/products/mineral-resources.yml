name: Mineral resources
slug: mineral-resources
theme: minerals
portfolio_pages:
- 95
- 96
overview: BGS’s mineral resources dataset assesses the location and extent of potential mineral resources
  for various commodities across Great Britain. It identifies areas where geological conditions indicate
  the presence of economically important minerals. Focus is given to construction and industrial minerals
  due to the importance of indigenous supply to the UK economy. It supports long-term resource planning,
  safeguarding and sustainable development by offering an authoritative, geology-based view of where mineral
  resources are likely to occur.
benefits:
- text: Offers a consistent, authoritative national overview of mineral resource potential
- text: Supports mineral safeguarding, helping planning authorities protect important resources from sterilisation
    by development
- text: Helps identify areas with future extraction potential, supporting long-term supply security
- text: Provides evidence for planning applications, environmental assessments and land-use decisions
- text: Reduces uncertainty where local mineral information is incomplete or outdated
- text: Helps industry and Government understand strategic mineral distribution
features:
- text: National coverage across Great Britain
- text: 1:50 000 scale (±50 m)
- text: Geology-based delineation of mineral resource areas, providing details of deposit type and associated
    economic mineral resource
- text: Coverage of multiple commodity types, including aggregates, industrial minerals, building stone
    and construction resources
- text: GIS vector format for ease of geospatial analysis
- text: Complements other BGS datasets including BritPits, geological maps and mineral occurrence records
