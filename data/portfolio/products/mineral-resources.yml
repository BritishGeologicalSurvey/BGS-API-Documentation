target_markets:
- text: Mineral planning authorities and local government
- text: Mineral extraction companies and resource planners
- text: Environmental and engineering consultants
- text: Developers
- text: National and regional policymakers
challenges:
- text: Difficulty identifying mineral resources without specialist geological knowledge
- text: Fragmented or outdated local datasets, especially for older or unworked deposits
- text: Regulatory requirements to consider mineral safeguarding in planning decisions
- text: Uncertainty about future resource potential, particularly for construction aggregates and industrial
    minerals
- text: Challenges assessing sterilisation risk, where development may prevent future extraction
- text: Need for early-stage screening before detailed geological investigations are commissioned
use_cases:
- text: 'Mineral safeguarding assessments: determining whether proposed developments lie within safeguarded
    resource areas'
- text: 'Planning applications: providing evidence on mineral potential to support or challenge development
    proposals'
- text: 'Resource evaluation: identifying areas with potential for future quarrying or extraction'
- text: 'Strategic planning: supporting local and national policies on mineral supply and land-use allocation'
- text: 'Environmental impact assessments: understanding how developments may affect mineral resources
    or extraction viability'
- text: 'Industry analysis: mapping the distribution of aggregates, building stone, industrial minerals
    or energy minerals'
