target_markets:
- text: Local authorities and planning officers
- text: Transport and utilities infrastructure owners and managers
- text: Engineering and environmental consultants
- text: Insurers, lenders and risk assessors
- text: Conveyancing reporters
- text: Developers and landowners
- text: Mineral and land-use planners
challenges:
- text: Lack of reliable historical mining records, especially for small-scale or undocumented workings
- text: Unexpected ground collapse or subsidence, which are costly to repair and mitigate
- text: Fragmented data sources spread over multiple repositories, requiring expert interpretation
- text: Regulatory and due-diligence requirements for land development and asset management
- text: Uncertainty about the extents of old workings, especially where only partial plans exist
use_cases:
- text: 'Infrastructure risk assessment: identifying roads, pipelines or railways at risk from collapse'
- text: 'Planning applications: screening development sites for potential mining-related hazards'
- text: 'Site investigation scoping: determining where intrusive investigation or geophysical surveys
    are required'
- text: 'Asset management: prioritising maintenance or monitoring in areas with known or likely underground
    voids'
- text: 'Emergency response planning: understanding areas susceptible to sudden ground failure'
- text: 'Insurers: supporting insurance underwriting and claims analysis for ground subsidence'
- text: 'Lenders: informing loan approval for mortgage applications'
- text: 'Property transactions: reporting potential hazards to properties during conveyancing searches'
- text: 'Historical mining research: mapping the distribution of non-coal mining across Great Britain'
