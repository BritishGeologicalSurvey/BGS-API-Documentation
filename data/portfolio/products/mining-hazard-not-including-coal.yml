name: Mining hazard (not including coal)
slug: mining-hazard-not-including-coal
theme: hazards
portfolio_pages:
- 71
- 72
overview: BGS’s mining hazard (not including coal) dataset provides a national assessment of where past
  underground non-coal mining may have occurred and the potential for associated ground instability. It
  maps the location, extent and indicative hazard level of former underground workings across Great Britain,
  drawing on geological evidence, mine plans, scientific literature and expert knowledge, and represents
  the most comprehensive national overview of Britain’s non-coal mining legacy.
benefits:
- text: Consistent, national classification of non-coal mining hazards, supporting early-stage planning
    and risk screening
- text: Helps identify where underground voids may exist, even when no surface evidence remains
- text: Compiles evidence from various sources into a single resource, streamlining data discovery and
    evidence-gathering efforts
- text: Applies a bespoke methodology for seven different commodity types, considering different mining
    styles to provide a comprehensive and robust assessment
- text: Helps prioritise site investigations, focusing resources where mining is likely or known
features:
- text: National coverage across Great Britain
- text: 1:50 000 scale (±50 m)
- text: Five-class hazard rating system with detailed class descriptions
- text: Name of legacy working provided (where known) to support further research
- text: Bespoke methodology for seven commodity categories, each processed using tailored geological criteria
- text: Derived from multiple sources, including authoritative BGS geological mapping, mine abandonment
    plans, BGS databases of known working locations and mining literature reviews
- text: GIS vector format for ease of geospatial analysis
- text: Periodically updated to incorporate newly available mining records and improved geological mapping
- text: Designed for early-stage assessment, complementing but not replacing site-specific investigation
- text: Open access available for a generalised, low-resolution version of the data
