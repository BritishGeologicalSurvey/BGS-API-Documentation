target_markets:
- text: Environmental scientists and consultants
- text: Agricultural advisors and land managers
- text: Local authorities and planners
- text: Hydrologists and flood risk specialists
- text: Geotechnical and engineering consultants
- text: Academics
challenges:
- text: Limited soil data availability makes assessing soil behaviour difficult without a proxy dataset
- text: Fragmented information sources on factors influencing soil characteristics
- text: Inconsistent local mapping due to variation in soil-forming factors over short distances
- text: Need for digital geospatial data rather than legacy paper maps
use_cases:
- text: 'Agricultural planning: identifying areas with shallow, sandy or erosion-prone soils to guide
    crop selection or soil protection measures'
- text: 'Catchment management: modelling sediment sources and predicting where run-off or soil wash is
    likely during heavy rainfall'
- text: 'Environmental impact assessments: establishing baseline soil and subsoil conditions for infrastructure,
    renewable energy or housing developments'
- text: 'Digital soil modelling: combining parent material data with climate and land-use layers to generate
    high - resolution soil property maps'
- text: 'Carbon and natural capital assessments: understanding where carbonate-rich or organic parent
    materials influence soil chemistry and ecosystem services'
- text: 'Erosion mitigation planning: identifying slopes and soil textures most susceptible to water or
    wind erosion'
