name: Soil parent material model
slug: soil-parent-material-model
theme: baseline-geology
portfolio_pages:
- 13
- 14
overview: BGS’s soil parent material model maps the geological materials from which soils in Great Britain
  develop. It describes the near-surface weathered zone, which typically comprises the material from the
  base of the soil profile down to 3 m. The dataset integrates 1:50 000-scale geological mapping, terrain
  data and a wide range of BGS geochemical, geotechnical and borehole records to provide a consistent
  representation of soil-forming materials across Great Britain. It includes attributes such as parent
  material lithology, grain size, soil texture, soil group, carbonate content, soil depth and susceptibility
  to erosion by water or wind.
benefits:
- text: Provides a scientifically robust foundation for understanding how soils form, behave and vary
    across landscapes
- text: Offers insight into where site-specific soil data is sparse, enabling evidence-based decisions
    at regional and national scales
- text: Supports environmental modelling, land-use planning and agricultural management
- text: Improves assessments of land capability, natural capital and ecosystem services
- text: Improves understanding of how geology influences soil vulnerability to erosion, run-off and wind
    deflation
features:
- text: National coverage across Great Britain
- text: 1:50 000 scale (±50 m)
- text: 'Detailed attribute set, including:'
  sub:
  - generalised parent material lithology
  - parent material grain size
  - soil layer thickness
  - carbonate content ranking
  - European Soil Bureau parent material type
  - soil group (light; medium; heavy soils)
  - soil texture (sand; silt; clay; loam; peat and chalk variants)
  - susceptibility to water erosion, soil wash and wind erosion
- text: Derived from multiple authoritative datasets, including BGS geological mapping, topsoil geochemistry,
    borehole records, geotechnical data and OS Terrain 50
- text: GIS vector format for ease of geospatial analysis
- text: Open access available for a generalised, low-resolution version of the data
