target_markets:
- text: Coastal planners and local authorities
- text: Environmental and engineering consultants
- text: Infrastructure owners
- text: Shoreline management plan teams and coastal partnerships
- text: Insurers and risk analysts
- text: Conservation organisations and ecologists
challenges:
- text: Uncertainty about long-term coastal change, especially with accelerating sea-level rise
- text: Limited integration of geology into coastal risk assessments, which often focus only on hydrodynamics
- text: Fragmented or inconsistent datasets with regional inconsistencies, making national comparison
    difficult
- text: Regulatory pressure to demonstrate coastal resilience in planning and permitting
- text: High costs associated with unexpected erosion, cliff instability or coastal flooding
- text: Difficulty in predicting how different coastal landforms (for example, cliffs; dunes; estuaries)
    will respond to storms or climate change
use_cases:
- text: 'Coastal risk screening: identifying vulnerable stretches of coastline for planning or investment
    decisions'
- text: 'Shoreline management plans: providing geological context for ‘hold the line’, ‘managed realignment’
    or ‘no active intervention’ policies'
- text: 'Infrastructure planning: assessing erosion or flooding risk for railways, roads, pipelines or
    energy assets'
- text: 'Climate-adaptation strategies: understanding how different coastal types may respond to sea-level
    rise'
- text: 'Environmental impact assessments: evaluating how developments may interact with dynamic coastal
    systems'
- text: 'Habitat management: supporting conservation of dunes, salt marshes and other coastal ecosystems
    sensitive to change'
- text: 'Dynamic coastal change modelling: baseline data providing geological context within coastal change
    models'
