target_markets:
- text: Insurers and risk analysts
- text: Banks and mortgage lenders
- text: Environmental regulators
- text: Infrastructure owners and operators
- text: Civil, environmental and geotechnical engineers
- text: Conveyancing reporters
challenges:
- text: Increases in subsidence insurance claims due to hotter, drier summers and increased rainfall variability
- text: Regulatory pressures to provide evidence-based climate change adaptation policy plans
- text: Uncertainty about how climate change will affect ground stability at regional and local scales
- text: High costs associated with reactive repairs, insurance impacts and infrastructure disruption
- text: Difficulty integrating climate projections with geological susceptibility
use_cases:
- text: 'Financial portfolio stress testing: banks, lenders and insurers must test their portfolios for
    resilience to climate change risks'
- text: 'Infrastructure planning: identifying buried and built infrastructure corridors likely to experience
    increased ground movement to mitigate impacts'
- text: 'Local planning policy: integrating future shrink–swell susceptibility into development control'
- text: 'Asset maintenance scheduling: prioritising inspections in areas where susceptibility is projected
    to increase'
- text: 'Network resilience assessment: identifying areas of increasing susceptibility to support adaptation
    planning and budgeting'
- text: 'Climate adaptation strategies: designing foundations or drainage systems that are resilient to
    future soil moisture extremes'
