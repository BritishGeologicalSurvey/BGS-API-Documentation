name: 'BGS Civils: corrosivity (ferrous)'
slug: bgs-civils-corrosivity-ferrous
theme: engineering-geology
portfolio_pages:
- 23
- 24
overview: 'BGS Civils: corrosivity (ferrous) classifies the corrosivity of near - surface ground conditions
  to buried ferrous (iron and steel) infrastructure across Great Britain. It translates 1:50 000-scale
  geological, geochemical and engineering geology information into a practical assessment of how likely
  soils, superficial deposits and shallow bedrock are to corrode ferrous materials. The dataset assigns
  each geological unit a corrosivity class, from non-aggressive to very highly aggressive, based on factors
  such as moisture content, acidity, organic content, sulfate presence and soil texture. The dataset is
  part of the wider BGS Civils suite, which provides engineering-relevant geological intelligence for
  early-stage design, asset management and risk assessment.'
benefits:
- text: Early identification of corrosion risk before intrusive ground investigation
- text: Improved asset protection, helping engineers select appropriate materials, coatings and mitigation
    strategies
- text: Reduced life-cycle costs, as corrosion is a major cause of pipeline, cable and foundation failures
- text: Consistent, national-scale information, avoiding reliance on localised or inconsistent datasets
- text: Better long-term resilience planning, especially for utilities and transport networks with extensive
    buried assets
features:
- text: National coverage across Great Britain, aligned with BGS’s geological mapping
- text: 1:50 000 scale (±50 m)
- text: 'Corrosivity classification for ferrous materials considering:'
  sub:
  - water content
  - redox status
  - pH
  - sulfates/sulfides
  - electrical resistivity
- text: GIS vector format for ease of geospatial analysis
- text: Consistent classification based on BGS engineering geology expertise and geotechnical literature
- text: Part of the BGS Civils suite, which can be combined with datasets about geological materials and
    their engineering characteristics
