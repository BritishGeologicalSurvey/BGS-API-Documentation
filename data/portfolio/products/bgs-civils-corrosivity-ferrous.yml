challenges:
- text: Unexpected and premature corrosion failures have high maintenance and replacement costs
- text: Limited early-stage ground information ahead of site investigation
- text: Fragmented or inconsistent data sources on all corrosion risk factors
- text: Regulatory requirements to demonstrate active management of corrosion risk
- text: Inefficient mitigation planning without susceptibility mapping
use_cases:
- text: 'Pipeline route planning: identifying sections of a proposed pipeline that pass through highly
    corrosive soils, enabling targeted protection'
- text: 'Foundation design: assessing whether steel piles or sheet piles require coatings, cathodic protection
    or alternative materials'
- text: 'Utility asset management: prioritising inspection and replacement programmes for assets located
    in aggressive ground conditions'
- text: 'Highway and rail projects: evaluating corrosion risk for buried drainage systems, culverts and
    retaining structures along long linear corridors'
- text: 'Carbon and cost modelling: estimating long-term maintenance needs and embodied carbon associated
    with corrosion mitigation'
