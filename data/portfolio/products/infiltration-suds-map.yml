target_markets:
- text: Local authorities and planners • Developers
- text: Civil engineers and drainage designers • Water and sewerage companies
- text: Environmental and geotechnical engineering • Transport and utilities infrastructure owners consultants
challenges:
- text: Difficulty assessing the most appropriate form of infiltration SuDS, especially in areas with
    complex geology or shallow groundwater
- text: Regulatory pressure to include infiltration SuDS in planning applications before site testing,
    without clear evidence of feasibility
- text: Unexpected design failures when infiltration capacity is overestimated
- text: High costs associated with redesigning drainage systems when infiltration proves unsuitable
- text: Challenges interpreting geological and hydrological information for drainage planning
use_cases:
- text: 'Early-stage drainage strategy design: screening sites to determine whether infiltration SuDS
    are feasible before detailed investigation'
- text: 'Planning applications: providing evidence to meet local planning requirements'
- text: 'Flood risk assessments: identifying opportunities to reduce run-off through infiltration'
- text: 'Urban redevelopment: evaluating whether brownfield sites can incorporate infiltration drainage'
- text: 'Catchment-scale planning: supporting local authorities in identifying areas suitable for nature-based
    drainage solutions'
