name: Superficial deposit thickness model
slug: superficial-deposit-thickness-model
theme: baseline-geology
portfolio_pages:
- 15
- 16
overview:
- text: 'observation-driven model: direct interpolation of thickness from borehole data'
- text: 'terrain-adjusted model: thickness model combining boreholes, mapped superficial boundaries and
    terrain'
- text: 'rockhead elevation model: interpolated elevation of the bedrock surface relative to Ordnance
    Datum'
- text: 'data distance (DataDist) grid: distance from each grid cell to the nearest borehole or mapped
    boundary, used as a proxy for uncertainty'
benefits:
- text: Derived from expert interpretation of a national repository of borehole logs with bespoke data-cleaning
    workflows applied
- text: Supports early-stage planning, feasibility studies and conceptual ground models ahead of site
    investigation
- text: Provides rockhead elevation, critical for engineering design, hydrogeology and environmental assessments
- text: Highlights uncertainty via the DataDist layer, helping users judge confidence in modelled values
- text: Integrates field mapping of superficial deposit coverage with site - specific observations of
    deposit thickness from boreholes and topography
features:
- text: National coverage across Great Britain, aligned with BGS 1:50 0000-scale geological mapping
- text: 1:100 000-scale with a vertical modelled precision of ±5 m elevation, presented as 50 m raster
    cells aligned to OS Terrain® 50 Digital Terrain Model
- text: Integration of borehole, geological mapping and terrain data
- text: Modelled superficial thickness and rockhead elevation values
- text: Minimum 1 m thickness applied where superficial deposits are mapped
- text: Uncertainty proxy via DataDist
- text: Designed for regional - to local-scale use (not site-specific)
- text: Clear documentation of limitations and assumptions
- text: Open access available for a generalised, low-resolution version of the data
licencing:
