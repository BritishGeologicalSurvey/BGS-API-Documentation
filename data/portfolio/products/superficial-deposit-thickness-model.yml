target_markets:
- text: Civil and geotechnical engineers
- text: Hydrogeologists
- text: Environmental scientists and consultants
- text: Geologists and geomorphologists
- text: Local authorities and planners
challenges:
- text: Time-consuming manual interpretation of geological maps, topography and boreholes
- text: Limited access to borehole logs
- text: Difficulty understanding regional variation in superficial thickness along linear asset networks
- text: Uncertainty in rockhead depth before site investigation
- text: Need to understand uncertainty levels in modelled data
use_cases:
- text: 'Prefeasibility engineering studies: estimating likely excavation depths or foundation requirements'
- text: 'Groundwater modelling: identifying superficial aquifers and confining layers'
- text: 'Flood risk and drainage assessments: understanding sediment thickness in floodplains'
- text: 'Route selection for infrastructure: screening corridors for areas of deep superficial deposits'
- text: 'Environmental impact assessments: establishing baseline geological conditions'
- text: 'Research into glacial and post-glacial landscape evolution: using thickness patterns to infer
    palaeo - topography'
