    .
- heading: null
  text: Underpinning survey point data is available under licence on request. There is no charge for this
    data, but it is subject to a data preparation fee.
- heading: null
  text: Please get in touch (digitaldata@bgs.ac.uk) for more information.
target_markets:
- text: Environmental consultants
- text: Regulators and environmental protection agencies
- text: Local authorities and planners
- text: Researchers studying geochemistry, pollution pathways and catchment processes
- text: Water industry professionals
- text: Conservation and ecology organisations
challenges:
- text: Difficulty distinguishing natural geochemical signatures from contamination, especially in areas
    with historic mining
- text: Lack of consistent catchment-scale data, making it hard to interpret sediment sample analyses
- text: Regulatory pressure to demonstrate compliance with environmental standards for water and sediment
    quality
- text: Uncertainty in mineral exploration, where geochemical indicators are essential for early-stage
    reconnaissance
- text: Fragmented or outdated local datasets, which may not reflect current environmental conditions
- text: Challenges in assessing ecological and human health risks without robust geochemical context
use_cases:
- text: 'Pollution tracing: identifying elevated metal concentrations downstream of industrial sites,
    landfills or abandoned mines'
- text: 'Mineral exploration: detecting geochemical anomalies that may indicate mineralisation in upstream
    catchments'
- text: 'Catchment management: supporting river-basin planning and water-quality assessments'
- text: 'Environmental impact assessments: baseline data for developments near rivers and streams'
- text: 'Long term monitoring: tracking changes in sediment chemistry due to land-use change or remediation'
- text: 'Academic study: sediment transport, geochemical cycling and environmental change research'
