name: UK stream sediment geochemistry
slug: uk-stream-sediment-geochemistry
theme: geochemistry
portfolio_pages:
- 41
- 42
overview: BGS’s UK stream sediment geochemistry dataset models the chemical composition of stream sediments
  across the UK. Stream sediments act as natural collectors of material eroded from surrounding rocks
  and soils, providing an integrated picture of catchment-scale geochemistry. Concentrations of 18 major
  and trace elements, such as calcium, magnesium, cobalt and nickel, derived from 110 794 sediment samples
  from small streams across the UK, are interpolated to produce national element concentration maps. These
  offer a high-quality geochemical baseline with applications for environmental assessment, mineral exploration,
  land-use planning and pollution monitoring.
benefits:
- text: A consistent national baseline for environmental monitoring and regulatory compliance
- text: Captures catchment-scale geochemical signatures, helping identify natural and anthropogenic sources
    of elements such as metals
- text: Evidence for mineral prospectivity, as stream sediments can highlight geochemical anomalies linked
    to mineralisation
- text: Support for pollution detection, especially downstream of industrial, mining or agricultural areas
- text: High-quality, laboratory-verified data that improves the accuracy of environmental modelling and
    risk assessments
- text: A complementary dataset to soil and water geochemistry, enabling multi-evidential approach to
    environmental analysis
features:
- text: National coverage across the UK with systematic sampling of stream sediments
- text: Modelled element concentrations provided for 18 key elements as wt% or mg/kg, with supporting
    standard deviation values as an indicator of associated uncertainty
- text: Geochemical predictions on a regular 500 × 500 m grid with supporting information on regional
    sample density and appropriate scale of use
- text: GIS raster formats supporting geospatial analysis with an image atlas available for reference
- text: In addition to the 18 elements presented as national maps, baseline stream sediment data is available
    for a more extensive suite of elements with incomplete national coverage
- text: Baseline values that help distinguish natural geochemical patterns from contamination in stream
    sediments
licencing:
