target_markets:
- text: Conveyancing reporters
challenges:
- text: Limited visibility of property-level risk, as many datasets only provide regional or geological
    summaries
- text: Difficulty integrating geological data into property assessment workflows or interpreting geological
    maps for subsidence hazards
- text: Inconsistent or incomplete local information, making national-scale risk assessment difficult
use_cases:
- text: 'Property searches triage: assessing whether reported structural damage is consistent with shrink–swell
    behaviour'
- text: 'Proactive risk mitigation: understanding the factors contributing to subsidence hazards allows
    property owners to implement risk mitigation strategies'
- text: 'Property valuation: informing surveyors about long-term ground movement risk'
- text: 'Property transactions: reporting potential hazards to properties during conveyancing searches'
