name: Property subsidence assessment
slug: property-subsidence-assessment
theme: hazards
portfolio_pages:
- 73
- 74
overview: BGS’s property subsidence assessment dataset evaluates the likelihood of shrink–swell subsidence
  affecting individual properties across Great Britain. It combines geological data, tree locations and
  building characteristics to estimate how susceptible a property is to ground movement caused by the
  expansion and contraction of clay - rich soils. The dataset provides building-level insight, making
  it suitable for insurance, risk modelling, conveyancing searches and portfolio management applications.
benefits:
- text: Granular insights into shrink–swell hazards at both building and postcode levels
- text: Consideration of geological conditions, specific building attributes and local vegetation to provide
    a tailored assessment of susceptibility
- text: Regular updates mapping BGS susceptibility classes to the latest available building footprints
- text: Specifically developed for use in the conveyancing sector to identify high-risk areas and support
    customisation of risk profiles
features:
- text: National coverage across Great Britain
- text: Property-level subsidence risk assessment, offering accessible, fine-scale insights
- text: Postcode-level summaries available
- text: 'A combined susceptibility score considering:'
  sub:
  - underlying geology type
  - drainage systems
  - number of storeys
  - property age
  - building type
  - tree proximity
- text: Provides a comprehensive understanding of subsidence risks
- text: Individual scores per susceptibility factor are also provided, supporting flexible application
    of the scoring
- text: Consistent methodology, enabling comparison across regions and portfolios
- text: Regular updates to reflect the latest available building footprint, building properties and tree
    location data
- text: GIS vector format for ease of geospatial analysis
