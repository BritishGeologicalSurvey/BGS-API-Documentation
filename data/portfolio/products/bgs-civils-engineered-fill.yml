name: 'BGS Civils: engineered fill'
slug: bgs-civils-engineered-fill
theme: engineering-geology
portfolio_pages:
- 27
- 28
overview: 'BGS Civils: engineered fill identifies whether near-surface geological deposits across Great
  Britain are suitable for use as engineered fill and, if so, what use they are best suited for. Engineered
  fill is selected, placed and compacted to an appropriate specification in order that it will exhibit
  a required engineering behaviour. This dataset translates 1:50 000-scale geological mapping and engineering
  geology knowledge into a practical assessment distinguishing those deposits that are suitable for use
  as engineered fill from unsuitable deposits. The dataset is part of the wider BGS Civils suite, which
  provides engineering-relevant geological intelligence for early-stage design, asset management and risk
  assessment.'
benefits:
- text: Better planning of earthworks, road bases and foundations where specific geotechnical properties
    are required
- text: Improved understanding of the fill-type characteristics of near - surface materials
- text: More accurate forecasting of material re-use potential and costings of material removal and disposal
- text: Consistent national-scale intelligence for feasibility and concept design, before intrusive investigation
    is available
features:
- text: National coverage across Great Britain, aligned with BGS’s geological mapping
- text: 1:50 000 scale (±50 m)
- text: 'Classification of suitability for use as engineered fill, based on industry standards, considering:'
  sub:
  - geological material type
  - maximum particle size
  - presence of sulfate or readily oxidised sulfide
- text: GIS vector format for ease of geospatial analysis
- text: Consistent classification based on BGS’s engineering geology expertise and geotechnical literature
- text: Part of the BGS Civils suite, which can be combined with datasets about geological materials and
    their engineering characteristics
