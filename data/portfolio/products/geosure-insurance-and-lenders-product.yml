challenges:
- text: Difficulty specifically assessing impacts to buildings from ground movement consistently across
    regions
- text: Assessing multiple geological hazards in a single, comparable metric
- text: Lack of flexibility to assess specific areas of interest to single or multiple ground instability
    hazards
- text: Necessary to assess entire portfolios for hazard susceptibility with diverse spatial coverage
- text: Regulatory requirements to stress-test portfolios for financial resilience to hazards
- text: Need for accessible, postcode-level insights
- text: Requirement for regular updates to location information, for example postcodes
