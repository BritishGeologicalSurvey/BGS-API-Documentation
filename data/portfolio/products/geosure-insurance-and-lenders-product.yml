- text: 'Underwriting: flagging high-risk postcodes or areas of interest for additional scrutiny or premium
    adjustment'
- text: 'Portfolio risk modelling: aggregating hazard scores to understand exposure across regions'
- text: 'Claims triage: identifying whether geological conditions may have contributed to subsidence'
- text: 'Risk diversification: identifying hazard hotspots or low-susceptibility, untapped markets'
