overview: BGS’s GeoSure® insurance and lenders product provides an index - level assessment of potential
  financial loss from natural ground movement on low-rise buildings across Great Britain. It combines
  six geological hazards — landslides, shrink–swell subsidence, soluble rocks, running sands, compressible
  ground and collapsible deposits — into a normalised hazard rating. A combined hazard score for all six
  hazards is provided along with hazard scores for individual hazards. Score areas are available attached
  to postcodes or as raster and vector map formats with hazard scores presented as geospatial extents,
  with national coverage. Postcode data is updated biannually with new releases of OS Code-Point® data.
benefits:
- text: Offers a standardised, national-scale hazard index for insurance and lending decisions
- text: Supports hazard identification, underwriting and susceptibility estimation using statistically
    evaluated and expert elicited hazard models
- text: Provides consistent hazard ratings, enabling rapid integration into insurance workflows
- text: Provides combined and individual hazard scores supporting user preferences and flexibility of
    application
- text: Scores attached to regularly updated postcodes, allowing rapid, location-enabled analysis
- text: Available as raster and vector map formats with hazard scores presented as geospatial extents
    allowing for bespoke analysis
