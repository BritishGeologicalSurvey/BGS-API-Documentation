name: Permeability
slug: permeability
theme: hydrogeology
portfolio_pages:
- 89
- 90
overview: BGS’s permeability dataset qualitatively assesses the permeability characteristics of superficial
  deposits and bedrock geology across Great Britain. Permeability is the capacity of a rock to transmit
  a fluid. The dataset classifies how easily water can move vertically through the ground based on known
  hydrogeological characteristics of the various lithologies, considering their age, dissolution potential,
  degree of cementation and induration, and fracturing. The data provides a minimum and maximum permeability
  class along with a predominant flow mechanism.
benefits:
- text: Offers a nationally consistent permeability classification for the unsaturated zone
- text: Helps determine the feasibility of infiltration-based drainage systems, including infiltration
    SuDS
- text: Supports groundwater and hydrological assessments where permeability influences recharge, flow
    and storage
- text: Provides essential evidence for flood risk assessments, especially where infiltration or groundwater
    rise is a concern
- text: Helps prioritise site investigations, focusing resources where infiltration may constrain site
    drainage or require implementation of groundwater protection measures
features:
- text: National coverage across Great Britain
- text: 1:50 000 scale (±50 m)
- text: Five-class permeability classification, from very low to very high
- text: Maximum and minimum permeability classification for both superficial deposits and bedrock
- text: Classification of the type of flow expected within a lithology
- text: GIS vector format for ease of geospatial analysis
- text: Designed for early-stage screening, complementing site-specific infiltration testing
