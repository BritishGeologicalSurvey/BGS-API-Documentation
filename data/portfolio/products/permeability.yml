target_markets:
- text: Civil, environmental and geotechnical engineers
- text: Local authorities and planners
- text: Developers
- text: Water and sewerage companies
- text: Transport and utilities infrastructure owners
challenges:
- text: Difficulty assessing infiltration potential ahead of site investigation without reliable geological
    data
- text: Unexpected groundwater behaviour during construction due to misjudged permeability
- text: Regulatory requirements for infiltration SuDS and drainage strategies that require permeability
    evidence
- text: Limited availability of measurements for water movement through the undersaturated zone above
    the water table
- text: High costs associated with redesigning drainage or foundation systems when permeability is misunderstood
use_cases:
- text: 'Infiltration SuDS feasibility assessments: determining whether soakaways, infiltration basins
    or permeable pavements are suitable'
- text: 'Flood risk assessments: understanding how infiltration capacity affects run-off and groundwater
    rise'
- text: 'Foundation and construction planning: identifying areas where highly permeable or impermeable
    ground affects excavation or stability'
- text: 'Groundwater and pollutant modelling: providing permeability context for recharge and flow simulations'
- text: 'Infrastructure route planning: screening corridors for permeability-related risks such as rapid
    infiltration, perched water tables or pollution risk to vulnerable groundwater bodies'
- text: 'Environmental impact assessments: evaluating how developments may alter infiltration, groundwater
    recharge and groundwater pollution'
