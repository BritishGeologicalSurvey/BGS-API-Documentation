name: Hydrogeological maps of Scotland
slug: hydrogeological-maps-of-scotland
theme: hydrogeology
portfolio_pages:
- 85
- 86
overview: BGS’s hydrogeological maps of Scotland provide an overview of groundwater characteristics, aquifer
  behaviour, recharge potential and groundwater flow across Scotland. The groundwater vulnerability layer
  assesses the ability for general contaminants to reach the water table. The aquifer productivity layer
  illustrates how different geological units function as aquifers, how water moves through them and where
  groundwater resources are likely to be significant or limited, for both bedrock and superficial deposits.
benefits:
- text: A consistent national interpretation of Scotland’s hydrogeology, essential for early-stage planning
    and assessment
- text: Insight into aquifer productivity, permeability and groundwater availability
- text: Evidence for groundwater protection, pollution risk assessment and regulatory compliance
- text: Support for water supply planning, especially in rural or remote areas where groundwater is a
    key resource
- text: A foundation for flood risk and drainage assessments, where groundwater behaviour influences design
- text: A clear understanding of how geology controls groundwater flow, recharge and storage
features:
- text: National coverage across Scotland
- text: 1:100 000 scale (±100 m)
- text: Classification of aquifer productivity, including predominant groundwater flow mechanism and associated
    likely borehole yields (litres per second)
- text: Assessment of aquifer productivity for both bedrock and superficial deposit aquifers
- text: Five-class assessment of aquifer vulnerability, from very low to very high
- text: 'Assessment of individual factors influencing aquifer vulnerability, including:'
  sub:
  - bedrock groundwater flow mechanism
  - maximum permeability of superficial and bedrock deposits
  - thickness of overlying superficial deposits
  - presence of significant clay deposits
  - depth to groundwater in superficial and bedrock aquifers
- text: GIS vector format for ease of geospatial analysis
- text: Consistent methodology aligned with Scottish regulatory frameworks
