target_markets:
- text: Engineering and geotechnical consultants
- text: Urban planners and local authorities
- text: Environmental and geohazard specialists
- text: Mineral planners and resource managers
- text: Academics
challenges:
- text: Difficulty accessing consistent geological information at national or regional scale from disparate
    sources
- text: Need for digital geospatial data rather than legacy paper maps
- text: Uncertainty about subsurface conditions making early-stage assessment difficult without authoritative
    mapping
- text: Time-consuming compilation of robust geological evidence to meet legislative and regulatory requirements
- text: Challenging ground conditions cause delays and cost overruns if not identified early
- text: Complexity of national asset networks with a need to understand ground conditions for thousands
    of distributed assets
use_cases:
- text: 'Regional planning: local authorities require understanding of geological constraints across borough
    - scale areas, informing development strategies'
- text: 'Mineral safeguarding: assess whether proposed developments may sterilise mineral resources'
- text: 'Environmental impact assessments: consultants need to establish baseline geological conditions
    for major infrastructure or redevelopment projects'
- text: 'Brownfield redevelopment: identification of artificial ground helps determine remediation needs
    and engineering constraints'
- text: 'Natural capital and land-use reviews: geological information supports assessments of soil resources,
    groundwater recharge and ecosystem services'
