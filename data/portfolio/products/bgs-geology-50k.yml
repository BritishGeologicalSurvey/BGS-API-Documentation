name: BGS Geology 50K
slug: bgs-geology-50k
theme: baseline-geology
portfolio_pages:
- 9
- 10
overview: BGS Geology 50K provides 1:50 000-scale geological mapping across Great Britain. It provides
  99 per cent bedrock coverage and 95 per cent superficial deposits coverage, derived from decades of
  field surveys, legacy paper maps and modern digital capture. The dataset captures bedrock, superficial
  deposits, mass-movement deposits, artificial ground and linear features. It is designed for neighbourhood
  - to borough-scale understanding of geology.
benefits:
- text: National coverage and ±50 m spatial resolution support early - stage assessments where site-scale
    mapping (for example, 1:10 000 ) is not yet required
- text: Geological map compilation by regional geological experts from the premier provider of British
    geological data
- text: Accessible GIS data formats and free ‘view only’ services
features:
- text: 'Extensive national coverage: about 236 000 km², covering almost all of Great Britain'
- text: 1:50 000 scale (±50 m)
- text: 'Four thematic GIS layers:'
  sub:
  - bedrock geology
  - mass-movement deposits
  - superficial deposits
  - artificial ground
- text: Additional data on linear features (faults; mineral veins; coal seams; landforms, etc.)
- text: Rich attribution provides details of lithology, lithostratigraphy and chronostratigraphy, and
    applies the national standards of geological classification, the BGS Lexicon and the BGS Rock Classification
    Scheme
- text: Applies national standards of symbology and colour scheme
- text: Regularly updated to incorporate new surveys, digital capture and improved geological interpretations
- text: GIS vector format for ease of geospatial analysis
- text: 'Interoperability with other BGS datasets: BGS Geology 50K is the baseline dataset from which
    many other BGS datasets are derived'
