target_markets:
- text: Environmental consultants
- text: Local authorities and planners
- text: Water companies
- text: Environmental regulators
- text: Researchers studying groundwater systems and resource management
challenges:
- text: Difficulty differentiating aquifer types without specialist hydrogeological knowledge
- text: Regulatory requirements to assess groundwater impacts in planning and environmental permitting
- text: Uncertainty about abstraction potential, especially in areas with complex geology
- text: Challenges identifying pollution sensitive aquifers, particularly where superficial deposits obscure
    bedrock
- text: Need for early-stage screening before detailed hydrogeological investigations are commissioned
use_cases:
- text: 'Pollution risk assessments: evaluating the vulnerability of groundwater to contamination from
    industrial or agricultural activities'
- text: 'Water resource planning: identifying areas with potential for new groundwater abstraction'
- text: 'Infrastructure design: screening routes for aquifer sensitivity to avoid contamination or dewatering
    impacts'
- text: 'Environmental permitting: supporting decisions for waste sites, fuel storage or discharge to
    land'
- text: 'Catchment management: understanding how aquifer types influence recharge, flow and water availability'
