name: Aquifer designation
slug: aquifer-designation
theme: hydrogeology
portfolio_pages:
- 79
- 80
overview: BGS’s aquifer designation dataset defines bedrock and superficial aquifers for England and Wales,
  identifying where geological units act as principal or secondary aquifers or unproductive strata, based
  on their ability to store and transmit groundwater. These designations were developed in collaboration
  with the Environment Agency and underpin national groundwater management policy, supporting decisions
  about abstraction, protection and land-use planning. The dataset provides a consistent, authoritative
  framework for understanding groundwater resources at regional and local scales.
benefits:
- text: Provides a standardised national classification of aquifers used by regulators, planners and consultants
- text: Helps determine the importance of groundwater resources in a given area
- text: Supports risk assessments for pollution, abstraction and development
- text: Informs planning decisions, especially where groundwater protection zones or sensitive aquifers
    are present
- text: Helps identify where groundwater may be a viable water supply source
- text: Reduces uncertainty by offering a clear, policy-aligned interpretation of geological units
features:
- text: National coverage for England and Wales
- text: 1:50 000 scale (±50 m)
- text: 'Classification of aquifer type as: rather than strategic scale'
  sub:
  - 'principal: deposits that provide a high level of water storage'
  - 'secondary: deposits that can support water supplies at a local'
- text: Assessment of both bedrock and superficial deposits
- text: GIS vector format for ease of geospatial analysis
- text: Consistent methodology aligned with regulatory frameworks
- text: Free to view online
