challenges:
- text: Difficulty identifying where debris flows could originate, especially in remote upland terrain
- text: Lack of consistent national data for infrastructure planning, route maintenance and asset risk
    assessment
- text: High costs from unexpected events and repeated closures
- text: Need for evidence-based hazard information to support cost benefit analysis studies, infrastructure
    design proposals, insurance and property valuation
- text: Challenges managing outside party slopes that threaten rail and road assets
use_cases:
- text: 'Rail network hazard screening: assessing landslide hazards from outside party slopes'
- text: 'Road corridor risk assessment: identifying high-susceptibility slopes along trunk roads to support
    emergency response preparedness and road maintenance budgeting'
- text: 'Utility route planning: screening pipeline or overhead line corridors for slope failure exposure'
- text: 'Local authority hazard mapping: supporting planning policy, emergency planning and climate resilience
    strategies'
- text: 'Insurance risk modelling: informing underwriting and pricing for properties in upland or steep
    slope regions'
- text: 'Environmental and academic research: understanding geomorphological processes and slope evolution'
