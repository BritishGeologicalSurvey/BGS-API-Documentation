name: GeoSure® debris flow susceptibility model
slug: geosure-debris-flow-susceptibility-model
theme: hazards
portfolio_pages:
- 63
- 64
overview: BGS’s GeoSure ® debris flow susceptibility model identifies areas in Great Britain with the
  potential to initiate a debris flow. A debris flow is a rapid, downslope flow of poorly sorted debris
  mixed with water. These flows are a widespread phenomenon in mountainous terrain and are distinct from
  other types of landslides as they can occur periodically on established paths. The data evaluates natural
  geological, hydrogeological and geomorphological conditions to identify potential source areas. The
  dataset is part of the wider BGS GeoSure® suite, which provides an assessment of the natural susceptibility
  of geological deposits to potential ground movement.
benefits:
- text: Understanding where natural slopes may generate debris flows
- text: Supports risk reduction, resilience planning and asset protection for infrastructure, utilities
    and property
- text: Enables early-stage hazard screening before commissioning detailed site investigations
- text: Reduces the likelihood of unexpected slope failures, which can be costly and disruptive
- text: Provides evidence for risk modelling, particularly for transport infrastructure
features:
- text: National coverage across Great Britain
- text: 1:50 000 scale (±50 m)
- text: GIS raster format with a 50 m cell size, for ease of geospatial analysis
- text: 'Identification of potential debris flow source areas (rather than run out or deposition zones)
    considering: terrain models)'
  sub:
  - geological materials
  - hydrological and permeability characteristics
  - slope and geomorphology (derived from high-resolution digital
- text: Derived from authoritative BGS geological mapping, geotechnical data, and geomorphological interpretation
- text: Periodically updated to incorporate new geological information and improved mapping
- text: Designed for early-stage assessment, complementing but not replacing site-specific investigation
- text: Delivered as a bundle with the GeoSure landslides data for a complete assessment of landslide
    susceptibility
