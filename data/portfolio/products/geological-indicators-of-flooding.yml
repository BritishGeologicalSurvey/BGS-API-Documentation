name: Geological indicators of flooding
slug: geological-indicators-of-flooding
theme: hazards
portfolio_pages:
- 57
- 58
overview: BGS’s geological indicators of flooding dataset identifies landforms and sediments created by
  past flood events. These geological features, such as alluvial deposits, river terraces, floodplain
  sediments and coastal storm-wash deposits, provide evidence of where flooding has occurred historically
  over long timescales. Because geology records events far beyond the period of instrumental or historical
  data, the dataset offers a long-term perspective on flood susceptibility across Great Britain.
benefits:
- text: Reveals long-term flood patterns that are not captured in modern flood-risk maps
- text: Helps identify areas where flooding has occurred repeatedly over centuries or millennia
- text: Supports planning and development decisions by highlighting flood-prone landforms
- text: Provides evidence for catchment and coastal management, complementing hydrological models
- text: Helps organisations understand multi-source flood risk, including river and coastal processes
features:
- text: National coverage across Great Britain
- text: 1:50 000 scale (±50 m)
- text: Identification of flood-related landforms, including alluvium, river terraces, floodplain deposits
    and coastal storm deposits
- text: Differentiation between deposits that represent areas with a high potential to flood (‘Zone 1’
    ) and deposits representing areas susceptible to flooding in more extreme events such as very heavy
    and prolonged periods of rainfall or extreme storm surges (‘Zone 2’)
- text: Long-term flood evidence, extending far beyond recorded flood history
- text: GIS vector format for ease of geospatial analysis
- text: Designed to complement hydrological and flood model datasets, offering a multi-layered view of
    flood risk
