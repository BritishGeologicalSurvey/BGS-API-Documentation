target_markets:
- text: Local authorities and planners
- text: Environmental regulators
- text: Environmental and engineering consultants
- text: Transport and utilities infrastructure owners
- text: Catchment and coastal managers
- text: Insurers and risk analysts assessing long-term flood susceptibility
- text: Researchers studying floodplain evolution, geomorphology and climate impacts
- text: Developers and landowners
challenges:
- text: Limited historical flood data, especially in rural areas or before modern monitoring began
- text: Difficulty identifying long-term flood susceptibility, which hydrological models alone cannot
    show
- text: Regulatory pressure to demonstrate long-term flood resilience in planning applications
- text: Increasing climate-driven extremes, making long-term flood context more important
use_cases:
- text: 'Planning applications: screening sites for long-term flood susceptibility before design begins'
- text: 'Flood risk assessments: incorporating geological evidence to complement hydrological modelling'
- text: 'Infrastructure planning: identifying routes vulnerable to floodplain inundation or coastal storm
    deposits'
- text: 'Catchment management: understanding how rivers have historically migrated or overtopped their
    banks'
- text: 'Coastal resilience: mapping areas affected by storm deposits'
- text: 'Environmental impact assessments: evaluating how developments may interact with flood-formed
    landforms'
