challenges:
- text: Uncertainty estimating cut, fill and stockpile volumes without indicative bulking factors
- text: Increased costs from insufficient space for stockpiles or unexpected disposal costs
- text: Fragmented or inconsistent data on bulking factors leading to inconsistent assumptions across
    projects
- text: Limited early-stage ground information ahead of site investigation
- text: Inaccurate estimates hinder early carbon modelling for environmental and carbon accounting
use_cases:
- text: 'Highway or rail corridor design: estimating cut and fill balance along long linear routes to
    optimise haulage and reduce carbon emissions'
- text: 'Site redevelopment: predicting how much excavated material will expand when removed from foundations,
    basements or service trenches'
- text: 'Stockpile planning: determining the land area required to store excavated material during construction'
- text: 'Landfill and disposal forecasting: estimating the volume of material requiring off-site disposal
    once bulking is accounted for'
- text: 'Carbon modelling: using bulking estimates to calculate haulage distances, fuel use and embodied
    carbon'
- text: 'Early-stage risk assessment: identifying geological units likely to produce unexpectedly high
    bulking or compaction behaviour'
