- 22
overview: 'BGS Civils: bulking volume provides estimated bulking and compaction factors for geological
  materials across Great Britain. It is derived from BGS’s 1:50 000-scale geological mapping and engineering
  geology expertise, and gives indicative values for how different soil and rock types change in volume
  when excavated, transported, stockpiled or compacted. The dataset is designed for use in civil engineering,
  earthworks planning, infrastructure design and environmental assessment, helping users anticipate material
  behaviour before intrusive investigation. The dataset is part of the wider BGS Civils suite, which provides
  engineering-relevant geological intelligence for early-stage design, asset management and risk assessment.'
benefits:
- text: Bulking factors compiled from scientific literature and applied nationally
- text: Early estimates of cut and fill volumes before site investigation
- text: Indicative bulking and compaction behaviour for a wide range of geological materials
- text: Reduced uncertainty in material handling, transport and disposal planning
- text: Better forecasting of stockpile sizes, haulage requirements and landfill needs
- text: Improved environmental and carbon assessments, as material movement is a major contributor to
    project emissions
features:
- text: National coverage across Great Britain
- text: 1:50 000 scale (±50 m)
- text: Bulking and compaction factors for a wide range of rock and sediment geological materials sourced
    from scientific literature
- text: GIS vector format for ease of geospatial analysis
- text: Consistent classification based on BGS’s engineering geology expertise and geotechnical literature
- text: Part of the BGS Civils suite, which can be combined with datasets about geological materials and
    their engineering characteristics
