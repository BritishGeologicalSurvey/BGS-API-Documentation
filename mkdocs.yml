# Builds with Zensical (primary) or Material for MkDocs 9.7.x (fallback):
#   zensical build        |   mkdocs build
site_name: BGS Data Products & APIs
site_url: https://britishgeologicalsurvey.github.io/BGS-API-Documentation/
site_description: British Geological Survey data products, user guides, APIs and worked examples.
repo_url: https://github.com/BritishGeologicalSurvey/BGS-API-Documentation
repo_name: BGS-API-Documentation
edit_uri: edit/main/docs/
copyright: © UKRI. Contains British Geological Survey materials.

theme:
  name: material
  language: en
  custom_dir: overrides
  logo: assets/brand/bgs-logo-primary-reversed.svg
  favicon: assets/brand/favicon.svg
  font: false                 # self-hosted brand font (see stylesheets/bgs.css), no Google Fonts call
  palette:
    scheme: bgs
    primary: custom
    accent: custom
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

extra_css:
  - stylesheets/bgs.css

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/BritishGeologicalSurvey/BGS-API-Documentation

nav:
  - Home: index.md
  # BEGIN GENERATED PRODUCTS NAV
