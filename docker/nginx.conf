# Mirrors GitHub Pages: site lives under /BGS-API-Documentation/ (from site_url),
# so this catches any link that only works when served from the domain root.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = / { return 302 /BGS-API-Documentation/; }

    location /BGS-API-Documentation/ {
        try_files $uri $uri/ =404;
        error_page 404 /BGS-API-Documentation/404.html;
    }

    location ~* \.(woff2|webp|png|svg|css|js)$ { expires 1h; }
    location ~* \.pdf$ { default_type application/pdf; add_header Content-Disposition inline; }
}
