name: docs

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"        # weekly: re-run notebooks against the live APIs
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-docs.txt -r requirements.txt

      - name: Generate product pages from data/
        run: python scripts/build_products.py

      - name: Execute notebooks (falls back to un-executed render if an API is down)
        run: |
          python scripts/convert_notebooks.py --execute || {
            echo "::warning::Notebook execution failed; rendering without outputs";
            python scripts/convert_notebooks.py; }

      - name: Build
        run: zensical build --clean

      - name: Check relative links
        run: python scripts/check_links.py site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
